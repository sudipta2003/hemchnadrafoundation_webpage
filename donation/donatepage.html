<!DOCTYPE HTML>
<html>
	<head>
		<title>Donate Now - Pandit Hemchndra Foundation</title>
		<link rel="icon" type="image/png" href="../images/logo.png" />
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="../assets/css/main.css" />
		<style>
			html {
				scroll-behavior: smooth;
			}
			.coming-soon-container {
				display: flex;
				justify-content: center;
				align-items: center;
				min-height: 100vh;
				background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
				flex-direction: column;
				text-align: center;
				padding: 20px;
			}
			.coming-soon-box {
				background: white;
				padding: 60px 40px;
				border-radius: 10px;
				box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
				max-width: 600px;
			}
			.coming-soon-box h1 {
				color: #333;
				font-size: 3em;
				margin: 0 0 20px 0;
			}
			.coming-soon-box p {
				color: #666;
				font-size: 1.2em;
				margin: 20px 0;
				line-height: 1.6;
			}
			.heart-icon {
				font-size: 4em;
				color: #e74c3c;
				margin-bottom: 20px;
			}
			.back-link {
				display: inline-block;
				margin-top: 30px;
				padding: 12px 30px;
				background-color: #4091bf;
				color: white;
				text-decoration: none;
				border-radius: 5px;
				font-weight: bold;
				transition: background-color 0.3s ease;
			}
			.back-link:hover {
				background-color: #50a1cf;
			}
		</style>
	</head>
	<body>
		<div class="coming-soon-container">
			<div class="coming-soon-box">
				<div class="heart-icon">❤️</div>
				<h1>Donate Now</h1>
				<p>This page will soon be available!</p>
				<p>We are working hard to bring you an easy and secure way to support the Pandit Hemchndra Foundation. Thank you for your patience and generosity.</p>
				<a href="../index.html" class="back-link">← Back to Home</a>
			</div>
		</div>
	</body>
</html>
